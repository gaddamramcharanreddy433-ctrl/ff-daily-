name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Place google-services.json
        run: |
          f=$(find . -type f -iname '*google*services*' -not -path './.git/*' | head -n1)
          echo "Found: $f"
          cp "$f" app/google-services.json
      - name: Clean manifest
        run: |
          f=app/src/main/AndroidManifest.xml
          sed -i '1s/^\xEF\xBB\xBF//' "$f"
          sed -i '1s/^[[:space:]]*//' "$f"
      - name: List files and remove broken duplicate
        run: |
          find . -name '*.kt' -not -path './.git/*' -exec wc -l {} +
          find . -name 'MatchesScreen.kt' -size -3k -print -delete
      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
